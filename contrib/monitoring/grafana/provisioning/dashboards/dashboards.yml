# Serves everything under the dashboards directory as provisioned dashboards,
# which Grafana marks read-only in the UI: the panel set is what this repo
# ships, and edits made in the browser do not survive.
apiVersion: 1

providers:
  - name: pesque
    folder: Pesque
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
