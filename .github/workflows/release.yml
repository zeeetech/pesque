name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The image builds only when Release Please creates a release, which is what
  # creates the tag. A separate `on: tags` workflow would not fire: a tag made
  # with the default GITHUB_TOKEN does not trigger workflows, so the release is
  # chained here instead of depending on a PAT.
  image:
    name: Build and push to GHCR
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The host-side CLI: one static binary per target (Windows keeps the
  # docker/compose backends only; systemd/nixos need a Linux host). Binaries
  # land on the release as `pesque-<target>`; SHA256SUMS is assembled over
  # everything by the release-assets job, which is what install.sh and the
  # systemd `update` flow verify against.
  cli:
    name: CLI binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Read the pinned Zig version
        id: zig-version
        working-directory: cli
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        run: |
          version="${{ steps.zig-version.outputs.version }}"
          cd /tmp
          curl -fsSL "https://ziglang.org/download/${version}/zig-x86_64-linux-${version}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          dir="$(tar -tf zig.tar.xz | head -1 | cut -d/ -f1)"
          echo "$PWD/$dir" >> "$GITHUB_PATH"

      - name: Build and collect the targets
        working-directory: cli
        run: |
          set -eu
          mkdir -p dist
          for target in \
            x86_64-linux-musl \
            aarch64-linux-musl \
            x86_64-macos \
            aarch64-macos \
            x86_64-windows-gnu
          do
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe
            ext=""
            case "$target" in *windows*) ext=".exe" ;; esac
            cp "zig-out/bin/pesque$ext" "dist/pesque-$target$ext"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist/

  # The server release tarball (amd64 only; arm64 installs use the flake or
  # docker). Contains the release as a top-level `pesque/` dir, so the systemd
  # flow can unpack it straight into /opt/pesque-<tag>.
  tarball:
    name: Server release tarball (amd64)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: erlef/setup-beam@v1
        with:
          # Same toolchain CI tests with, so the tarball that ships is built
          # by the toolchain the suite exercises.
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
          version-type: strict

      - name: Install hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Build the release
        run: |
          mix deps.get --only prod
          MIX_ENV=prod mix release --path _build/prod/rel

      - name: Tar the release
        run: tar -czf pesque-server-x86_64-linux.tar.gz -C _build/prod/rel pesque

      - uses: actions/upload-artifact@v4
        with:
          name: server-tarball
          path: pesque-server-x86_64-linux.tar.gz

  # Assemble everything onto the GitHub release, with one SHA256SUMS covering
  # the CLI binaries, the server tarball, and the bootstrap files. install.sh
  # and the compose bundle ride on the release itself so that
  # releases/latest/download/install.sh resolves and install.sh can fetch the
  # bundle (and verify it) against the same tag it was installed from.
  release-assets:
    name: Upload release assets
    needs: [release-please, cli, tarball]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect the bootstrap files
        run: cp install.sh docker-compose.yml docker-compose.build.yml Caddyfile dist/

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum pesque-* install.sh docker-compose.yml docker-compose.build.yml Caddyfile > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/SHA256SUMS
            dist/pesque-*
            dist/install.sh
            dist/docker-compose.yml
            dist/docker-compose.build.yml
            dist/Caddyfile
