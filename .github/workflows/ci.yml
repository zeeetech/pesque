name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: Elixir 1.20.4 / OTP 29.1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
          version-type: strict

      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential

      - name: Install hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run precommit
        run: mix precommit

  zig:
    name: Zig CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Zig version
        id: zig-version
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        run: |
          version="${{ steps.zig-version.outputs.version }}"
          cd /tmp
          curl -fsSL "https://ziglang.org/download/${version}/zig-x86_64-linux-${version}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          dir="$(tar -tf zig.tar.xz | head -1 | cut -d/ -f1)"
          echo "$PWD/$dir" >> "$GITHUB_PATH"

      - name: Check formatting
        run: zig fmt --check .

      - name: Run tests
        run: zig build test

      # Windows keeps the docker backend only; systemd needs a Linux host.
      - name: Cross-build the release targets
        run: |
          set -eu
          for target in \
            x86_64-linux-musl \
            aarch64-linux-musl \
            x86_64-macos \
            aarch64-macos \
            x86_64-windows-gnu
          do
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe
          done
