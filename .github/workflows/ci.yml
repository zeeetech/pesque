name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: Elixir 1.20.4 / OTP 29.1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
          version-type: strict

      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential

      - name: Install hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run precommit
        run: mix precommit
