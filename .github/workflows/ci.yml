name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      elixir: ${{ steps.filter.outputs.elixir }}
      zig: ${{ steps.filter.outputs.zig }}
      distribution: ${{ steps.filter.outputs.distribution }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            elixir:
              - 'lib/**'
              - 'test/**'
              - 'config/**'
              - 'priv/**'
              - 'mix.exs'
              - 'mix.lock'
              - '.formatter.exs'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - '.github/workflows/ci.yml'
            zig:
              - 'cli/**'
              - '.github/workflows/ci.yml'
            distribution:
              - 'deploy/compose/**'
              - 'docker/**'
              - 'Dockerfile'
              - 'pesque.conf.example'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  precommit:
    name: Elixir 1.20.4 / OTP 29.1.1
    needs: changes
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
          version-type: strict

      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential

      - name: Install hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run precommit
        run: mix precommit

  zig:
    name: Zig CLI
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Zig version
        id: zig-version
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Cache the Zig toolchain
        id: zig-toolchain
        uses: actions/cache@v4
        with:
          path: ~/zig-toolchain
          key: zig-${{ runner.os }}-${{ steps.zig-version.outputs.version }}

      - name: Install Zig
        if: steps.zig-toolchain.outputs.cache-hit != 'true'
        run: |
          version="${{ steps.zig-version.outputs.version }}"
          curl -fsSL "https://ziglang.org/download/${version}/zig-x86_64-linux-${version}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig-toolchain"
          tar -xf /tmp/zig.tar.xz --strip-components=1 -C "$HOME/zig-toolchain"

      - name: Add Zig to PATH
        run: echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"

      - name: Cache the build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          key: zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('cli/build.zig', 'cli/build.zig.zon', 'cli/root.zig', 'cli/src/**/*.zig') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-

      - name: Check formatting
        run: zig fmt --check .

      - name: Run tests
        run: zig build test

  zig-cross:
    name: Zig cross-build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows-gnu
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Zig version
        id: zig-version
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Restore the Zig toolchain
        id: zig-toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/zig-toolchain
          key: zig-${{ runner.os }}-${{ steps.zig-version.outputs.version }}

      - name: Install Zig
        if: steps.zig-toolchain.outputs.cache-hit != 'true'
        run: |
          version="${{ steps.zig-version.outputs.version }}"
          curl -fsSL "https://ziglang.org/download/${version}/zig-x86_64-linux-${version}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig-toolchain"
          tar -xf /tmp/zig.tar.xz --strip-components=1 -C "$HOME/zig-toolchain"

      - name: Add Zig to PATH
        run: echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"

      - name: Cache the build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          key: zig-build-${{ runner.os }}-${{ matrix.target }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('cli/build.zig', 'cli/build.zig.zon', 'cli/root.zig', 'cli/src/**/*.zig') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ matrix.target }}-${{ steps.zig-version.outputs.version }}-

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

  compose-bundle:
    name: Compose deployment bundle
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          for script in deploy/compose/pesque deploy/compose/smoke.sh docker/healthcheck.sh; do
            sh -n "$script"
          done

      - name: Validate Compose definition
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          version=1.0.0
          sed "s/@VERSION@/$version/g" deploy/compose/compose.yaml > "$work/compose.yaml"
          cp pesque.conf.example "$work/pesque.conf"
          mkdir "$work/backups"
          docker compose --project-directory "$work" \
            --file "$work/compose.yaml" config --quiet

      # The runner UID differs from the image's non-root pesque UID, so a
      # correctly private ./backups cannot be read or removed by the runner.
      # Only this host-side harness is elevated; the application stays non-root.
      - name: Build and exercise the real image
        run: sudo --preserve-env=GITHUB_RUN_ID deploy/compose/smoke.sh
