name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      elixir: ${{ steps.filter.outputs.elixir }}
      distribution: ${{ steps.filter.outputs.distribution }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            elixir:
              - 'lib/**'
              - 'test/**'
              - 'config/**'
              - 'priv/**'
              - 'mix.exs'
              - 'mix.lock'
              - '.formatter.exs'
              - '.github/workflows/ci.yml'
            distribution:
              - 'deploy/compose/**'
              - 'docker/**'
              - 'Dockerfile'
              - 'lib/**'
              - 'config/**'
              - 'priv/**'
              - 'mix.exs'
              - 'mix.lock'
              - 'pesque.conf.example'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            nix:
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yml'

  precommit:
    name: Elixir 1.20.4 / OTP 29.1.1
    needs: changes
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
          version-type: strict

      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential

      - name: Install hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run precommit
        run: mix precommit

  compose-bundle:
    name: Compose deployment bundle
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          for script in deploy/compose/pesque deploy/compose/smoke.sh docker/healthcheck.sh; do
            sh -n "$script"
          done

      - name: Validate Compose definition
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          version=1.0.0
          sed "s/@VERSION@/$version/g" deploy/compose/compose.yaml > "$work/compose.yaml"
          cp pesque.conf.example "$work/pesque.conf"
          mkdir "$work/backups"
          docker compose --project-directory "$work" \
            --file "$work/compose.yaml" config --quiet

      - name: Build and exercise the real image
        run: deploy/compose/smoke.sh

  nix-module:
    name: NixOS module
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate the module and build its wrapper
        run: |
          set -eu
          expr='
            let
              flake = builtins.getFlake (toString ./.);
              check = import ./nix/module-check.nix {
                nixpkgs = flake.inputs.nixpkgs;
                module = flake.nixosModules.pesque;
              };
            in
          '
          nix eval --raw --impure --expr "$expr check.result"
          wrapper=$(nix build --no-link --print-out-paths --impure --expr "$expr check.wrapper")
          "$wrapper/bin/pesque" --help >/dev/null
